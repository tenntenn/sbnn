name: Feature request
description: Suggest something sbnn should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The situation you ran into, rather than the feature you have in mind.
        It is often solvable a way you did not expect.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like sbnn to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
    validations:
      required: false
