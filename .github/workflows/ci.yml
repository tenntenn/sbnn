name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Installs the pinned go-task and tagpr from aqua.yaml, so `task` below
      # is the same version the release workflow uses.
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
      - run: task lint
      # test-go rather than test: `task test` runs the web suite too, which the
      # web job below covers and this job has no Node for.
      - run: task test-go
      - run: go build ./...

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # `pnpm run build` is `tsc -b && vite build`, so this is the TypeScript
      # type check as well; a separate `tsc --noEmit` step would be redundant.
      - run: pnpm run build
        working-directory: web
      # web/test is the only automated check on the TypeScript no Go test can
      # reach: the word-level diff, the suggestion parser, the search matcher,
      # the shortcut table, the exported page's static client. Compiling is
      # not running them.
      - run: pnpm test
        working-directory: web

# The build output under web/dist is deliberately not compared against the
# tree here: dist is regenerated in batches rather than committed per change,
# so a sync check would fail on every pull request.
#
# test/visual (Playwright) is deliberately not run here either, for the same
# reason. It drives the committed web/dist, so on a pull request that changes
# web/src it reports on how old the bundle is rather than on the change. Run it
# yourself; test/visual/README.md says what it pins and what it guards.
