name: release

# Builds the binaries for a tag and attaches them to its GitHub release.
# Nothing here decides what the version is: the tag does.
#
# tagpr.yml calls this with the tag it pushed when its release pull request
# was merged; a tag tagpr pushes with GITHUB_TOKEN would not start this on its
# own. A tag pushed by hand does, through the push trigger, and an existing
# tag can be built again from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build and release.
        required: true
        type: string
  # By hand, for a tag whose release has no binaries yet - one cut before
  # tagpr.yml called this, or one whose build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release, such as v0.0.1.
        required: true
        type: string

permissions:
  contents: read

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Uploading the archives to the release tagpr created.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that the tag GoReleaser builds the version
          # from is reachable from the checkout.
          fetch-depth: 0
          persist-credentials: false
          # The tag the caller names, or the one that was pushed.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
