version: '3'

vars:
  GO: go
  PNPM: pnpm

tasks:
  build:
    desc: Builds the review UI and the sbnn binary.
    deps: [web, bin]

  web:
    desc: Builds the review UI that gets embedded into the binary.
    dir: web
    cmds:
      - "{{.PNPM}} install --frozen-lockfile"
      - "{{.PNPM}} run build"

  bin:
    cmds:
      - "{{.GO}} build ./..."

  install:
    deps: [web]
    cmds:
      - "{{.GO}} install ."

  test:
    desc: Runs both suites, which together are what CI runs.
    cmds:
      - task: test-go
      - task: test-web

  test-go:
    desc: Runs the Go tests. This is what the `go` CI job runs.
    cmds:
      - "{{.GO}} test ./..."

  # web/test holds the tests for the TypeScript no Go test reaches. They are
  # their own task rather than part of `test-go` so that the `go` CI job stays
  # Go-only and needs no Node, while `task test` locally still means
  # everything CI runs.
  #
  # test/visual is not here: it is a Playwright suite over the committed
  # web/dist with its own lockfile and its own README, and it pins open
  # defects with test.fail(), so it goes red when one is fixed. Run it from
  # test/visual by hand.
  test-web:
    desc: Runs the review UI tests. This is what the `web` CI job runs.
    dir: web
    cmds:
      - "{{.PNPM}} install --frozen-lockfile"
      - "{{.PNPM}} test"

  lint:
    cmds:
      - "{{.GO}} vet ./..."
      - "gofmt -l . | grep -v '^web/node_modules' && exit 1 || true"
      # go fix rewrites code the standard library has since given a better
      # spelling -- strings.Cut for an Index/slice pair, for range N, slices.Sort.
      # -diff prints the patch instead of applying it and exits non-zero when
      # there is one, so this reports rather than edits under your feet. Run
      # `go fix ./...` to take the patch.
      - "{{.GO}} fix -diff ./..."
      - "{{.GO}} mod tidy"
      - "git diff --exit-code go.mod go.sum"

  dev:
    desc: Runs the sbnn server in the foreground and the Vite dev server, which proxies /_ to it.
    deps: [dev-server, dev-web]

  dev-server:
    internal: true
    cmds:
      - "{{.GO}} run . --foreground"

  dev-web:
    internal: true
    dir: web
    cmds:
      - "{{.PNPM}} run dev"

  clean:
    desc: |
      Leaves web/dist alone: its contents are committed and go:embed needs
      them to build the binary. Run `task web` to regenerate them.
    cmds:
      - rm -rf web/node_modules
